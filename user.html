<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>考勤打卡</title>
  <!-- 更换为国内稳定的饿了么 CDN 镜像 -->
  <script src="https://npm.elemecdn.com/bmob-js-sdk@2.2.5/dist/Bmob-2.2.5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, sans-serif; background: #fff; color: #1a1a1a; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .screen { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; padding: 32px 24px; text-align: center; }
    .btn { width: 100%; max-width: 280px; height: 48px; background: #1a1a1a; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .name-input { width: 100%; max-width: 280px; height: 48px; border: 1.5px solid #e0e0e0; border-radius: 10px; text-align: center; font-size: 18px; margin-bottom: 20px; outline: none; }
    .punch-circle { width: 160px; height: 160px; border-radius: 50%; background: #1a1a1a; color: #fff; border: none; font-size: 20px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    .spinner { width: 24px; height: 24px; border: 3px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-msg { margin-top: 20px; color: #888; font-size: 14px; }
  </style>
</head>
<body>

  <div class="screen" id="screen-loading" style="display: flex;">
    <div class="spinner" style="border-top-color: #000;"></div>
    <div style="margin-top: 20px; color: #666;">正在连接云端...</div>
  </div>

  <div class="screen" id="screen-setup">
    <div style="font-size: 24px; margin-bottom: 24px;">👋 欢迎使用</div>
    <input class="name-input" id="name-input" type="text" placeholder="请输入你的姓名" />
    <button class="btn" onclick="saveName()">确认并保存</button>
  </div>

  <div class="screen" id="screen-punch">
    <div id="greeting" style="color: #888; margin-bottom: 8px;">你好</div>
    <div id="date-label" style="font-size: 13px; color: #bbb; margin-bottom: 40px;"></div>
    <button class="punch-circle" id="punch-btn" onclick="startPunch('Manual')">
      <span id="btn-text">立即打卡</span>
    </button>
    <div id="status-text" class="status-msg"></div>
    <div style="margin-top: 50px; font-size: 12px; color: #eee;" onclick="localStorage.clear();location.reload();">更换姓名</div>
  </div>

<script>
  // 初始化检测
  function initApp() {
    try {
      if (typeof Bmob === 'undefined') {
        document.getElementById('screen-loading').innerHTML = "<div style='color:red;padding:20px;'>SDK 加载失败，请尝试刷新页面或检查网络</div>";
        return;
      }
      Bmob.initialize("50e71adc8989ba089e9efb08c6dd69f0", "e7bbe051480c6b7668d07dfcbe5b44b5");
      
      const name = localStorage.getItem("ck_user_name");
      if (name) {
        document.getElementById('greeting').textContent = "你好，" + name;
        document.getElementById('date-label').textContent = new Date().toLocaleDateString();
        showScreen('screen-punch');
        const params = new URLSearchParams(window.location.search);
        if (params.get('from') === 'nfc') setTimeout(() => startPunch('NFC'), 1000);
      } else {
        showScreen('screen-setup');
      }
    } catch (e) {
      alert("启动失败: " + e.message);
    }
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
    document.getElementById(id).style.display = 'flex';
  }

  async function saveName() {
    const name = document.getElementById('name-input').value.trim();
    if (!name) return;
    localStorage.setItem("ck_user_name", name);
    try {
      const q = Bmob.Query("MemberNames");
      q.set("name", name);
      await q.save();
      location.reload();
    } catch (e) { location.reload(); }
  }

  async function startPunch(method) {
    const btnText = document.getElementById('btn-text');
    const punchBtn = document.getElementById('punch-btn');
    punchBtn.disabled = true;
    btnText.innerHTML = '<div class="spinner"></div>';

    navigator.geolocation.getCurrentPosition(async (pos) => {
      try {
        const fRes = await Bmob.Query("FenceConfig").find();
        if (fRes.length === 0) { alert("云端未配置围栏数据"); location.reload(); return; }
        const fence = fRes[0];
        const dist = Math.round(calcDist(pos.coords.latitude, pos.coords.longitude, fence.lat, fence.lng));
        
        if (dist > fence.radius) {
          alert(`不在范围：距考勤点 ${dist} 米，需在 ${fence.radius} 米内`);
          location.reload();
          return;
        }

        const punch = Bmob.Query("PunchRecords");
        punch.set("name", localStorage.getItem("ck_user_name"));
        punch.set("punchDate", new Date().toISOString().split('T')[0]);
        punch.set("punchTime", Date.now());
        punch.set("method", method);
        await punch.save();
        alert(`打卡成功！\n方式：${method === 'NFC' ? 'NFC贴纸' : '手动'}`);
        location.reload();
      } catch (e) { alert("打卡失败: " + e.message); location.reload(); }
    }, (err) => { 
      alert("定位失败，请确保开启 GPS 并允许位置权限"); 
      location.reload(); 
    }, { enableHighAccuracy: true, timeout: 10000 });
  }

  function calcDist(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  window.onload = initApp;
</script>
</body>
</html>
